# Coverage aliases (cargo-llvm-cov + llvm-tools + cargo-nextest are installed).
# The full test matrix needs the `full` feature set plus the Mode-B `rholang`
# and `metta` toggles (which `full` deliberately excludes); `--all-features`
# would additionally pull the reserved `gpu` and heavy `ml-linfa` stacks.
[alias]
cov = ["llvm-cov", "--features", "full rholang metta", "--html", "--output-dir", "target/coverage"]
cov-text = ["llvm-cov", "--features", "full rholang metta", "--summary-only"]
cov-open = ["llvm-cov", "--features", "full rholang metta", "--html", "--open"]
cov-nextest = ["llvm-cov", "nextest", "--features", "full rholang metta", "--summary-only"]
# Invoke as `cargo +nightly cov-branch`; LLVM branch coverage is nightly-only.
cov-branch = ["llvm-cov", "--branch", "--features", "full rholang metta", "--summary-only"]
