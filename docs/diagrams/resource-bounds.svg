<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="MINDMAP" height="482px" preserveAspectRatio="none" style="width:669px;height:482px;background:#FFFFFF;" version="1.1" viewBox="0 0 669 482" width="669px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#F1F3F5" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="132.3281" x="10" y="213.4961"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="112.3281" x="20" y="235.563">Resource bounds</text><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="102.7734" x="192.3281" y="42.6992"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="82.7734" x="202.3281" y="64.7661">Construction</text><rect fill="#F1F3F5" height="80.5313" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="303.4102" x="345.1016" y="20"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="196.168" x="355.1016" y="42.0669">max_file_size = 10 MB default</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="283.4102" x="355.1016" y="57.1997">build() rejects larger source before parsing.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="231.7339" x="355.1016" y="72.3325">build_from_tree (Mode B) skips it &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="259.9619" x="355.1016" y="87.4653">the caller already owns a bounded tree.</text><path d="M295.1016,60.2656 L305.1016,60.2656 C320.1016,60.2656 320.1016,60.2656 335.1016,60.2656 L345.1016,60.2656" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,231.0625 L152.3281,231.0625 C167.3281,231.0625 167.3281,60.2656 182.3281,60.2656 L192.3281,60.2656" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="109.9907" x="192.3281" y="178.3633"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="89.9907" x="202.3281" y="200.4302">VF2 matching</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="291.1084" x="352.3188" y="120.5313"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="271.1084" x="362.3188" y="142.5981">max_matches cap (0 = unlimited default)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="238.0308" x="362.3188" y="157.731">short-circuits the state-space search</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="210.5073" x="362.3188" y="172.8638">once the match limit is reached.</text><path d="M302.3188,195.9297 L312.3188,195.9297 C327.3188,195.9297 327.3188,153.2305 342.3188,153.2305 L352.3188,153.2305" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="246.478" x="352.3188" y="205.9297"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="165.4644" x="362.3188" y="227.9966">strict_kinds / strict_edges</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="226.478" x="362.3188" y="243.1294">tighten the feasibility test, pruning</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="176.8711" x="362.3188" y="258.2622">infeasible branches earlier.</text><path d="M302.3188,195.9297 L312.3188,195.9297 C327.3188,195.9297 327.3188,238.6289 342.3188,238.6289 L352.3188,238.6289" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,231.0625 L152.3281,231.0625 C167.3281,231.0625 167.3281,195.9297 182.3281,195.9297 L192.3281,195.9297" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="47.5615" x="192.3281" y="306.4609"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="27.5615" x="202.3281" y="328.5278">DFG</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="262.3599" x="289.8896" y="291.3281"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="140.4863" x="299.8896" y="313.395">max_iterations = 100</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="242.3599" x="299.8896" y="328.5278">caps the reaching-definitions fixpoint</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="207.9556" x="299.8896" y="343.6606">sweeps so it always terminates.</text><path d="M239.8896,324.0273 L249.8896,324.0273 C264.8896,324.0273 264.8896,324.0273 279.8896,324.0273 L289.8896,324.0273" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,231.0625 L152.3281,231.0625 C167.3281,231.0625 167.3281,324.0273 182.3281,324.0273 L192.3281,324.0273" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="62.7261" x="192.3281" y="391.8594"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="42.7261" x="202.3281" y="413.9263">Slicing</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="315.585" x="305.0542" y="376.7266"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="295.585" x="315.0542" y="398.7935">max_nodes on backward_slice / forward_slice</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="258.8765" x="315.0542" y="413.9263">bounds the PDG reverse/forward BFS &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="291.2686" x="315.0542" y="429.0591">returns as soon as the slice reaches the cap.</text><path d="M255.0542,409.4258 L265.0542,409.4258 C280.0542,409.4258 280.0542,409.4258 295.0542,409.4258 L305.0542,409.4258" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,231.0625 L152.3281,231.0625 C167.3281,231.0625 167.3281,409.4258 182.3281,409.4258 L192.3281,409.4258" fill="none" style="stroke:#495057;stroke-width:1.1;"/><g class="caption" data-source-line="2"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="529.9014" x="68.8052" y="466.1201">Resource bounds that keep libcpg's work finite on large or untrusted inputs</text></g></g></svg>