<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="MINDMAP" height="1421px" preserveAspectRatio="none" style="width:795px;height:1421px;background:#FFFFFF;" version="1.1" viewBox="0 0 795 1421" width="795px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#F1F3F5" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="132.3281" x="10" y="683.1875"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="112.3281" x="20" y="705.2544">Resource bounds</text><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="102.7734" x="192.3281" y="42.6992"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="82.7734" x="202.3281" y="64.7661">Construction</text><rect fill="#F1F3F5" height="80.5313" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="303.4102" x="345.1016" y="20"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="196.168" x="355.1016" y="42.0669">max_file_size = 10 MB default</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="283.4102" x="355.1016" y="57.1997">build() rejects larger source before parsing.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="231.7339" x="355.1016" y="72.3325">build_from_tree (Mode B) skips it &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="259.9619" x="355.1016" y="87.4653">the caller already owns a bounded tree.</text><path d="M295.1016,60.2656 L305.1016,60.2656 C320.1016,60.2656 320.1016,60.2656 335.1016,60.2656 L345.1016,60.2656" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,60.2656 182.3281,60.2656 L192.3281,60.2656" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="113.2217" x="192.3281" y="221.0625"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="93.2217" x="202.3281" y="243.1294">Call resolution</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="282.1582" x="355.5498" y="120.5313"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="161.2559" x="365.5498" y="142.5981">max_scope_depth = 128</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="262.1582" x="365.5498" y="157.731">bounds parent and callee-subtree depth</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="250.8149" x="365.5498" y="172.8638">and visited sets cut malformed cycles.</text><path d="M305.5498,238.6289 L315.5498,238.6289 C330.5498,238.6289 330.5498,153.2305 345.5498,153.2305 L355.5498,153.2305" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="297.0498" x="355.5498" y="205.9297"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="213.2876" x="365.5498" y="227.9966">max_candidates_per_name = 64</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="244.2578" x="365.5498" y="243.1294">bounds retained candidate identifiers</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="277.0498" x="365.5498" y="258.2622">without changing the full ambiguity count.</text><path d="M305.5498,238.6289 L315.5498,238.6289 C330.5498,238.6289 330.5498,238.6289 345.5498,238.6289 L355.5498,238.6289" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="278.4448" x="355.5498" y="291.3281"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="136.8491" x="365.5498" y="313.395">max_calls = 100,000</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="258.4448" x="365.5498" y="328.5278">processes a deterministic NodeId prefix</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="215.6934" x="365.5498" y="343.6606">and leaves later calls untouched.</text><path d="M305.5498,238.6289 L315.5498,238.6289 C330.5498,238.6289 330.5498,324.0273 345.5498,324.0273 L355.5498,324.0273" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,238.6289 182.3281,238.6289 L192.3281,238.6289" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="109.9907" x="192.3281" y="434.5586"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="89.9907" x="202.3281" y="456.6255">VF2 matching</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="291.1084" x="352.3188" y="376.7266"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="271.1084" x="362.3188" y="398.7935">max_matches cap (0 = unlimited default)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="238.0308" x="362.3188" y="413.9263">short-circuits the state-space search</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="210.5073" x="362.3188" y="429.0591">once the match limit is reached.</text><path d="M302.3188,452.125 L312.3188,452.125 C327.3188,452.125 327.3188,409.4258 342.3188,409.4258 L352.3188,409.4258" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="246.478" x="352.3188" y="462.125"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="165.4644" x="362.3188" y="484.1919">strict_kinds / strict_edges</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="226.478" x="362.3188" y="499.3247">tighten the feasibility test, pruning</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="176.8711" x="362.3188" y="514.4575">infeasible branches earlier.</text><path d="M302.3188,452.125 L312.3188,452.125 C327.3188,452.125 327.3188,494.8242 342.3188,494.8242 L352.3188,494.8242" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,452.125 182.3281,452.125 L192.3281,452.125" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="47.5615" x="192.3281" y="562.6563"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="27.5615" x="202.3281" y="584.7231">DFG</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="341.458" x="289.8896" y="547.5234"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="137.8647" x="299.8896" y="569.5903">structural AST sweep</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="321.458" x="299.8896" y="584.7231">one ordinary pass, exactly two loop-body passes,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="279.9634" x="299.8896" y="599.856">and a path set that cuts malformed cycles.</text><path d="M239.8896,580.2227 L249.8896,580.2227 C264.8896,580.2227 264.8896,580.2227 279.8896,580.2227 L289.8896,580.2227" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,580.2227 182.3281,580.2227 L192.3281,580.2227" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="128.1577" x="192.3281" y="690.7539"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="108.1577" x="202.3281" y="712.8208">Monotone solver</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="312.0557" x="370.4858" y="632.9219"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="231.3149" x="380.4858" y="654.9888">max_visits_per_block = 256 default</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="292.0557" x="380.4858" y="670.1216">returns IterationLimitExceeded when a block</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="269.3501" x="380.4858" y="685.2544">would be extracted beyond the hard cap.</text><path d="M320.4858,708.3203 L330.4858,708.3203 C345.4858,708.3203 345.4858,665.6211 360.4858,665.6211 L370.4858,665.6211" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="335.2754" x="370.4858" y="718.3203"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="191.8896" x="380.4858" y="740.3872">widen_after + narrow_passes</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="287.7012" x="380.4858" y="755.52">widening is confined to LoopForest headers,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="315.2754" x="380.4858" y="770.6528">narrowing runs exactly the bounded pass count.</text><path d="M320.4858,708.3203 L330.4858,708.3203 C345.4858,708.3203 345.4858,751.0195 360.4858,751.0195 L370.4858,751.0195" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,708.3203 182.3281,708.3203 L192.3281,708.3203" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="171.6392" x="192.3281" y="861.5508"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="151.6392" x="202.3281" y="883.6177">Condensation analytics</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="360.4058" x="413.9673" y="803.7188"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="280.998" x="423.9673" y="825.7856">max_components = 1,000,000 hard ceiling</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="340.4058" x="423.9673" y="840.9185">total metrics return a capped incomplete report and</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="323.3242" x="423.9673" y="856.0513">direct Coffman-Graham returns BudgetExceeded.</text><path d="M363.9673,879.1172 L373.9673,879.1172 C388.9673,879.1172 388.9673,836.418 403.9673,836.418 L413.9673,836.418" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="331.6001" x="413.9673" y="889.1172"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="206.8892" x="423.9673" y="911.1841">public decomposition validation</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="311.6001" x="423.9673" y="926.3169">rejects inconsistent membership, invalid edges,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="276.7515" x="423.9673" y="941.4497">self-loops, cycles, and zero layering width.</text><path d="M363.9673,879.1172 L373.9673,879.1172 C388.9673,879.1172 388.9673,921.8164 403.9673,921.8164 L413.9673,921.8164" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,879.1172 182.3281,879.1172 L192.3281,879.1172" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="107.1787" x="192.3281" y="1032.3477"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="87.1787" x="202.3281" y="1054.4146">DSM visibility</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="403.3286" x="349.5068" y="974.5156"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="182.5713" x="359.5068" y="996.5825">MAX_DSM_NODES = 50,000</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="290.3735" x="359.5068" y="1011.7153">rejects before repeated breadth-first search,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="383.3286" x="359.5068" y="1026.8481">returns a capped incomplete result with no partial vectors.</text><path d="M299.5068,1049.9141 L309.5068,1049.9141 C324.5068,1049.9141 324.5068,1007.2148 339.5068,1007.2148 L349.5068,1007.2148" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="413.5166" x="349.5068" y="1059.9141"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="272.5811" x="359.5068" y="1081.981">public projection + provenance validation</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="393.5166" x="359.5068" y="1097.1138">rejects malformed forward/reverse CSR, mismatched nodes,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="315.8784" x="359.5068" y="1112.2466">vector lengths, and incomplete source analyses.</text><path d="M299.5068,1049.9141 L309.5068,1049.9141 C324.5068,1049.9141 324.5068,1092.6133 339.5068,1092.6133 L349.5068,1092.6133" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,1049.9141 182.3281,1049.9141 L192.3281,1049.9141" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="115.9956" x="192.3281" y="1203.1445"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="95.9956" x="202.3281" y="1225.2114">WL refinement</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="346.3076" x="358.3237" y="1145.3125"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="175.7095" x="368.3237" y="1167.3794">MAX_WL_ITERATIONS = 16</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="326.3076" x="368.3237" y="1182.5122">clamps every requested round count before work,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="301.0313" x="368.3237" y="1197.645">including a request of the machine maximum.</text><path d="M308.3237,1220.7109 L318.3237,1220.7109 C333.3237,1220.7109 333.3237,1178.0117 348.3237,1178.0117 L358.3237,1178.0117" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="374.3389" x="358.3237" y="1230.7109"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="225.2974" x="368.3237" y="1252.7778">shared public projection validation</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="354.3389" x="368.3237" y="1267.9106">rejects malformed node, CSR, weight, or reverse state</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="336.9653" x="368.3237" y="1283.0435">before indexed traversal and returns empty output.</text><path d="M308.3237,1220.7109 L318.3237,1220.7109 C333.3237,1220.7109 333.3237,1263.4102 348.3237,1263.4102 L358.3237,1263.4102" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,1220.7109 182.3281,1220.7109 L192.3281,1220.7109" fill="none" style="stroke:#495057;stroke-width:1.1;"/><rect fill="#FFE3E3" height="35.1328" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="62.7261" x="192.3281" y="1331.2422"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="42.7261" x="202.3281" y="1353.3091">Slicing</text><rect fill="#F1F3F5" height="65.3984" rx="3" ry="3" style="stroke:#181818;stroke-width:1.5;" width="315.585" x="305.0542" y="1316.1094"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="295.585" x="315.0542" y="1338.1763">max_nodes on backward_slice / forward_slice</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="258.8765" x="315.0542" y="1353.3091">bounds the PDG reverse/forward BFS &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="291.2686" x="315.0542" y="1368.4419">returns as soon as the slice reaches the cap.</text><path d="M255.0542,1348.8086 L265.0542,1348.8086 C280.0542,1348.8086 280.0542,1348.8086 295.0542,1348.8086 L305.0542,1348.8086" fill="none" style="stroke:#495057;stroke-width:1.1;"/><path d="M142.3281,700.7539 L152.3281,700.7539 C167.3281,700.7539 167.3281,1348.8086 182.3281,1348.8086 L192.3281,1348.8086" fill="none" style="stroke:#495057;stroke-width:1.1;"/><g class="caption" data-source-line="2"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="529.9014" x="131.7358" y="1405.5029">Resource bounds that keep libcpg's work finite on large or untrusted inputs</text></g></g></svg>