<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="680px" preserveAspectRatio="none" style="width:551px;height:680px;background:#000000;" version="1.1" viewBox="0 0 551 680" width="551px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="399.8789" x="5" y="17">PlantUML version $version$ / $git.commit.id$ [Unknown compile time]</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="3.12" x="5" y="33.3441">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="309.9503" x="5" y="49.6882">This version of PlantUML is 206 days old, so you should</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="327.0143" x="5" y="66.0323">consider upgrading from https://plantuml.com/download</text><rect fill="#33FF02" height="24.0679" style="stroke:#33FF02;stroke-width:1;" width="540.104" x="5" y="78.3765"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="268.687" x="6" y="93.3765">[From resource-bounds.puml (line 76) ]</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="5" y="116.4444">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="113.0636" x="5" y="135.5123">@startmindmap</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="257.921" x="5" y="154.5802">skinparam backgroundColor #FFFFFF</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="191.3932" x="5" y="173.6481">skinparam shadowing false</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="304.1909" x="5" y="192.716">skinparam defaultFontName "DejaVu Sans"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="206.9472" x="5" y="211.784">skinparam defaultFontSize 13</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="11.802" x="5" y="230.8519">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="148.0774" x="5" y="249.9198">... ( skipping 81 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="11.802" x="5" y="268.9877">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="381.2186" x="5" y="288.0556">***[#F1F3F5]:public projection + provenance validation</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="419.9424" x="5" y="307.1235">rejects malformed forward/reverse CSR, mismatched nodes,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="339.6807" x="5" y="326.1915">vector lengths, and incomplete source analyses.;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="187.8233" x="5" y="345.2594">**[#FFE3E3] Martin metrics</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="334.5847" x="5" y="364.3273">***[#F1F3F5]:projection + assignment validation</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="350.1107" x="5" y="383.3952">rejects malformed CSR before traversal and treats</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="377.7744" x="5" y="402.4631">absent nodes or invalid bucket indices as unassigned.;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="321.5088" x="5" y="421.531">***[#F1F3F5]:all-or-none SDP metric validation</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="406.3065" x="5" y="440.599">duplicate modules, non-finite instability, or values outside</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="540.104" x="5" y="459.6669">&lt;latex&gt;[0,1]&lt;/latex&gt; suppress the comparison rather than fabricate a verdict.;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="208.5152" x="5" y="478.7348">***[#F1F3F5]:input-sized work</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="361.1145" x="5" y="497.8027">no independent cap &#8212; hosts bound projection, CPG,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="296.2808" x="5" y="516.8706">module count, and name bytes at ingress.;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="224.3491" x="5" y="535.9385">**[#FFE3E3] Architectural smells</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="275.4769" x="5" y="555.0065">***[#F1F3F5]:validated evidence bundle</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="372.4406" x="5" y="574.0744">rejects malformed CSR, stale SCC, partial assignment,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="382.9126" x="5" y="593.1423">invalid options, and missing/duplicate/invalid metrics.;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="208.5152" x="5" y="612.2102">***[#F1F3F5]:input-sized work</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="408.3365" x="5" y="631.2781">iterative SCC recomputation and one-pass graph evidence;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" text-decoration="wavy underline" textLength="389.6325" x="5" y="650.346">hosts cap projection, module, and name size at ingress.;</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="341.2347" x="8.64" y="669.414">Syntax Error? (Assumed diagram type: mindmap)</text></g></svg>