spacing" textLength="97.7349" x="75.2538" y="271.1919">or run criterion</text><rect fill="#F1F3F5" height="50.2656" rx="3" ry="3" style="stroke:#495057;stroke-width:0.5;" width="186.6958" x="68.0468" y="304.2578"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="121.3164" x="78.0468" y="326.3247">tee output to a file</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="166.6958" x="78.0468" y="341.4575">(run once, analyze many)</text><rect fill="#FFF3BF" height="50.2656" rx="3" ry="3" style="stroke:#495057;stroke-width:0.5;" width="222.7759" x="50.0067" y="374.5234"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="202.7759" x="60.0067" y="396.5903">generate + analyze perf report</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="64.3462" x="60.0067" y="411.7231">in parallel</text><path d="M192.3947,434.7891 L192.3947,480.0547 L172.3947,484.0547 L192.3947,488.0547 L192.3947,533.3203 A0,0 0 0 0 192.3947,533.3203 L540.0958,533.3203 A0,0 0 0 0 540.0958,533.3203 L540.0958,444.7891 L530.0958,434.7891 L192.3947,434.7891 A0,0 0 0 0 192.3947,434.7891" fill="#FFF9DB" style="stroke:#F59F00;stroke-width:0.5;"/><path d="M530.0958,434.7891 L530.0958,444.7891 L540.0958,444.7891 L530.0958,434.7891" fill="#FFF9DB" style="stroke:#F59F00;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="132.8628" x="198.3947" y="451.856">Current coverage:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="64.981" x="335.3898" y="451.856">the active</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="236.3169" x="198.3947" y="466.9888">Criterion targets cover construction,</text><text fill="#000000" font-fami