ed_tracking / has_memoization_table</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="126.4072" x="26" y="326.856">-&gt; AlgorithmFamily</text><path d="M344.3613,352.4883 L344.3613,391.3203 L324.3613,395.3203 L344.3613,399.3203 L344.3613,438.1523 A0,0 0 0 0 344.3613,438.1523 L627.1958,438.1523 A0,0 0 0 0 627.1958,438.1523 L627.1958,362.4883 L617.1958,352.4883 L344.3613,352.4883 A0,0 0 0 0 344.3613,352.4883" fill="#FFF9DB" style="stroke:#F59F00;stroke-width:0.5;"/><path d="M617.1958,352.4883 L617.1958,362.4883 L627.1958,362.4883 L617.1958,352.4883" fill="#FFF9DB" style="stroke:#F59F00;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="223.9453" x="350.3613" y="369.5552">Returns Vec&lt;DetectedAlgorithm&gt;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="240.3604" x="350.3613" y="384.688">{ family, name, function, key_nodes,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="153.353" x="358.626" y="399.8208">signature, confidence }</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="229.9629" x="350.3613" y="414.9536">sorted by confidence (descending),</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="261.8345" x="350.3613" y="430.0864">filtered by min_confidence (default 0.5).</text><rect fill="#F1F3F5" height="50.2656" rx="3" ry="3" style="stroke:#495057;stroke-width:0.5;" width="295.6025" x="28.7588" y="370.1875"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="209.8345" x="38.7588" y="392.2544">DetectedAlgorithm { signature :</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="275.6025" x="38.7588" y="407.3872">AlgorithmSignat