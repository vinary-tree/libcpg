gthAdjust="spacing" textLength="235.0537" x="59.0332" y="115.5278">ControlFlowAnalyzer &#8212; detect loops</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="224.5801" x="59.0332" y="130.6606">(nesting depth, counted-ness) and</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="225.3545" x="59.0332" y="145.7935">recursion (direct / tail, base cases)</text><path d="M346.6592,168.8594 L346.6592,207.6914 L326.6592,211.6914 L346.6592,215.6914 L346.6592,254.5234 A0,0 0 0 0 346.6592,254.5234 L693.8779,254.5234 A0,0 0 0 0 693.8779,254.5234 L693.8779,178.8594 L683.8779,168.8594 L346.6592,168.8594 A0,0 0 0 0 346.6592,168.8594" fill="#FFF9DB" style="stroke:#F59F00;stroke-width:0.5;"/><path d="M683.8779,168.8594 L683.8779,178.8594 L693.8779,178.8594 L683.8779,168.8594" fill="#FFF9DB" style="stroke:#F59F00;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="219.2417" x="352.6592" y="185.9263">Phase 2 (detection/complexity.rs)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="326.2188" x="352.6592" y="201.0591">estimate_time_complexity -&gt; ComplexityEstimate</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="220.3081" x="352.6592" y="216.1919">{ class, confidence, justification }</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="288.4438" x="352.6592" y="231.3247">Combine loops vs recursion: keep the worse</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="273.2666" x="352.6592" y="246.4575">class via ComplexityClass::is_better_than.</text><rect fill="#FFF3BF" height="50.2656" rx="3" ry="3" style="stroke:#495057;stroke-width:0.5;" width="300.1982" x="26.4609" y="186.5586"/><text fill="#00000