" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="235.79" x="330.8042" y="178.2271">this size check &#8212; enforcing an input</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="259.873" x="293.7339" y="193.3599">bound is then the caller's responsibility.</text><rect fill="#D3F9D8" height="50.2656" rx="3" ry="3" style="stroke:#495057;stroke-width:0.5;" width="189.5332" x="78.2007" y="148.5938"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="128.5146" x="88.2007" y="170.6606">max_file_size guard</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="169.5332" x="88.2007" y="185.7935">(reject &gt; 10 MB in build())</text><rect fill="#DBE4FF" height="50.2656" rx="3" ry="3" style="stroke:#495057;stroke-width:0.5;" width="215.6284" x="65.1531" y="221.4258"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="105.5171" x="75.1531" y="243.4927">tree-sitter parse</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="195.6284" x="75.1531" y="258.6255">(bounded; no code execution)</text><rect fill="#F1F3F5" height="50.2656" rx="3" ry="3" style="stroke:#495057;stroke-width:0.5;" width="147.7339" x="99.1003" y="291.6914"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="111.9663" x="109.1003" y="313.7583">CPG construction</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="127.7339" x="109.1003" y="328.8911">(AST + CFG + DFG)</text><rect fill="#E5DBFF" height="110.7969" rx="3" ry="3" style="stroke:#495057;stroke-width:0.5;" width="313.9346" x="16" y="361.957"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="135.4717" x="26" y="384.0239">bounded ana